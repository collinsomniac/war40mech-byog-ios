[package]
name = "cogitator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
